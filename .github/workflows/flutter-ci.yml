name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  verify-backend:
    name: Verify Dart backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Fetch backend dependencies
        working-directory: backend
        run: dart pub get

      - name: Check backend formatting
        working-directory: backend
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze backend
        working-directory: backend
        run: dart analyze

      - name: Run backend contract tests
        working-directory: backend
        run: dart test

  verify-android:
    name: Verify Flutter and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test

      - name: Analyze
        # The backend is a separate Dart package checked in verify-backend.
        run: flutter analyze lib test integration_test

      - name: Run tests
        run: flutter test --concurrency=1

      - name: Keep visual comparison failures for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chetiwa-golden-failures
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Keep debug APK for reviewers
        uses: actions/upload-artifact@v4
        with:
          name: chetiwa-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
