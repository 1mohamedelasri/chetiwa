services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: chetiwa-api:local
    env_file:
      - production.env
    ports:
      # Cloudflared runs with host networking and reaches this loopback port.
      # The API is never exposed directly on the public Hetzner interface.
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/app/chetiwa-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

